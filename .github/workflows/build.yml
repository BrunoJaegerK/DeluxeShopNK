name: Build DeluxeShopNK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Download PM1E API jar
        run: |
          mkdir -p libs
          curl -fL --retry 3 -o libs/Nukkit-PM1E.jar https://github.com/PetteriM1/NukkitPetteriM1Edition/releases/latest/download/Nukkit-PM1E.jar
      - name: Package plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DeluxeShopNK
          path: target/DeluxeShopNK.jar