economy:
  # auto | llamaeconomy | economyapi | disabled
  provider: auto
max-purchase-amount: 2304

ui:
  title: "§l§bShop"
  main-content: "§7Choose a category to browse."
  category-content: "§7Select an item to purchase."
  item-button: "§b{item} §7- §a{price} {currency}"
  back-button: "§c« Back"
  purchase-title: "Purchase: {item}"
  purchase-prompt: "Price per item: {price} {currency}\nEnter the amount:"
  amount-placeholder: "Amount"

messages:
  invalid-amount: "&cEnter a valid amount within the configured limit."
  inventory-full: "&cYour inventory does not have enough space."
  no-money: "&cYou don't have enough money."
  transaction-failed: "&cThe payment could not be completed. Try again."
  economy-unavailable: "&cThe configured economy is unavailable. Contact an administrator."
  item-bought: "&aPurchased &e{amount}x {item} &afor &e{price} {currency}&a."

Commands:
  Shop:
    Name: "shop"
    Description: "Open the shop"
    Aliases: ["playershop", "tienda"]